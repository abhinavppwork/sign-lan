<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SignBridge – Real-time sign language detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f4f6;
  --ink:#14161c;
  --mute:#6b7080;
  --blue:#2335f0;
  --blue-deep:#1a28c4;
  --sun:#ffd83d;
  --white:#fbfbff;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --text:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--text)}

.page{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr);min-height:100vh}

/* ---------- left: camera ---------- */
.left{padding:36px clamp(24px,4vw,56px) 40px;display:flex;flex-direction:column;gap:26px}
.masthead{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.masthead h1{font:800 30px/1 var(--display);letter-spacing:-.035em}
.masthead p{margin-top:7px;color:var(--mute)}
.state{display:inline-flex;align-items:center;gap:8px;padding-top:4px;font-weight:500;color:var(--mute);white-space:nowrap}
.state i{width:9px;height:9px;border-radius:50%;background:#b9bcc8}
.state.on{color:var(--ink)}
.state.on i{background:#16b364;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,179,100,.45)}50%{box-shadow:0 0 0 6px rgba(22,179,100,0)}}

.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:calc(100vh - 230px);margin:0 auto;border-radius:22px;background:#15171d;overflow:hidden}
.stage img{display:none;width:100%;height:100%;object-fit:contain}
.stage.live img{display:block}
.idle{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#a9adbb}
.idle b{display:block;margin-bottom:6px;font:600 22px/1.2 var(--display);color:#fff;letter-spacing:-.02em}
.stage.live .idle{display:none}
.fps{position:absolute;right:14px;bottom:14px;padding:5px 11px;border-radius:99px;background:rgba(10,11,16,.62);color:#fff;font-size:13px;font-weight:500;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}

.controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.toggle{border:0;border-radius:99px;padding:15px 30px;background:var(--ink);color:#fff;font:600 15px var(--text);cursor:pointer;transition:background .15s,transform .1s}
.toggle:hover{background:#2a2e3a}
.toggle:active{transform:scale(.97)}
.toggle.stop{background:#e5383b}
.toggle.stop:hover{background:#c92d30}
.toggle:disabled{opacity:.5;cursor:wait}
.tip{max-width:36ch;color:var(--mute);font-size:14px}

/* ---------- right: the readout ---------- */
.right{background:var(--blue);color:var(--white);padding:36px clamp(24px,3.4vw,48px) 40px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.label{font-weight:500;color:rgba(251,251,255,.68)}

.reading{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:240px}
.letter{font:800 clamp(170px,19vw,290px)/.82 var(--display);letter-spacing:-.06em;margin:14px 0 18px -.04em}
.letter.pop{animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.86);opacity:.4}to{transform:scale(1);opacity:1}}
.status{font-size:16px;font-weight:500;min-height:24px}

.hold-top{display:flex;justify-content:space-between;margin-bottom:10px;font-weight:500}
.hold-top span:last-child{font-variant-numeric:tabular-nums}
.track{height:14px;border-radius:99px;background:var(--blue-deep);overflow:hidden}
.track div{height:100%;width:0;border-radius:inherit;background:var(--sun);transition:width .2s ease-out}

.spoken{padding-top:22px;border-top:1px solid rgba(251,251,255,.22)}
.chips{display:flex;flex-wrap:wrap;gap:8px 6px;min-height:46px;margin-top:10px;align-items:center}
.chip{font:800 34px/1 var(--display);letter-spacing:-.03em;min-width:34px;text-align:center}
.chip:last-child{color:var(--sun)}
.none{color:rgba(251,251,255,.6)}

button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

@media(max-width:900px){
  .page{grid-template-columns:1fr}
  .stage{max-height:none}
  .right{border-radius:28px 28px 0 0}
  .reading{min-height:0}
  .letter{font-size:170px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="page">

  <section class="left">
    <header class="masthead">
      <div>
        <h1>SignBridge</h1>
        <p>Real-time sign language detection</p>
      </div>
      <span class="state" id="state"><i></i><span id="stateText">Camera off</span></span>
    </header>

    <div class="stage" id="camera">
      <img id="feed" alt="Live camera feed">
      <div class="idle"><div><b>Camera is off</b>Start the camera to begin detecting ASL letters.</div></div>
      <span class="fps" id="fps">0 fps</span>
    </div>

    <div class="controls">
      <button class="toggle" id="toggle">Start camera</button>
      <p class="tip">Keep one hand fully in frame and hold the sign until the bar fills.</p>
    </div>
  </section>

  <section class="right" aria-live="polite">
    <div class="reading">
      <p class="label">Detected letter</p>
      <div class="letter" id="letter">—</div>
      <p class="status" id="status">Waiting for camera</p>
    </div>

    <div class="hold">
      <div class="hold-top"><span>Hold steady</span><span id="pct">0%</span></div>
      <div class="track"><div id="progress"></div></div>
    </div>

    <div class="spoken">
      <p class="label">Spoken letters</p>
      <div class="chips" id="history"><span class="none">Nothing spoken yet.</span></div>
    </div>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);
let isRunning = false, lastLetter = null, busy = false;

async function post(path){
  const r = await fetch(path, {method:'POST'});
  if(!r.ok) throw new Error(path);
  return r.json();
}

function setRunning(v){
  isRunning = v;
  $('camera').classList.toggle('live', v);
  $('state').classList.toggle('on', v);
  $('stateText').textContent = v ? 'Camera on' : 'Camera off';
  const t = $('toggle');
  t.textContent = v ? 'Stop camera' : 'Start camera';
  t.classList.toggle('stop', v);
  if(!v) $('feed').removeAttribute('src');
}

function render(s){
  if(s.letter !== lastLetter){
    const el = $('letter');
    el.textContent = s.letter;
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
    lastLetter = s.letter;
  }
  $('status').textContent = s.status;
  $('fps').textContent = s.fps + ' fps';
  $('progress').style.width = s.progress + '%';
  $('pct').textContent = s.progress + '%';

  const h = $('history');
  h.innerHTML = '';
  if(s.history.length){
    s.history.forEach(x => {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = x;
      h.appendChild(c);
    });
  } else {
    h.innerHTML = '<span class="none">Nothing spoken yet.</span>';
  }

  if(s.running !== isRunning){
    setRunning(s.running);
    if(s.running && !$('feed').getAttribute('src')) $('feed').src = '/video_feed?' + Date.now();
  }
}

async function refresh(){
  try{
    const r = await fetch('/api/status');
    if(!r.ok) throw new Error();
    render(await r.json());
  }catch(e){
    $('status').textContent = 'Lost connection to the server';
  }
}

$('toggle').onclick = async () => {
  if(busy) return;
  busy = true; $('toggle').disabled = true;
  try{
    if(isRunning){
      await post('/api/stop');
      setRunning(false);
    } else {
      await post('/api/start');
      $('feed').src = '/video_feed?' + Date.now();
      setRunning(true);
    }
    refresh();
  }catch(e){
    $('status').textContent = isRunning ? 'Could not stop the camera' : 'Could not start the camera. Check that it is not used by another app.';
  }finally{
    busy = false; $('toggle').disabled = false;
  }
};

setInterval(refresh, 450);
refresh();
</script>
</body>
</html>
