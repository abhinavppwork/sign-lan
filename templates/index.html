<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SignBridge AI</title><style>:root{color-scheme:dark;--bg:#08111f;--panel:#101c30;--line:#253957;--blue:#44b8ff;--green:#44e2a1;--muted:#9cadc5}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:#f3f7ff;background:radial-gradient(circle at 20% 0%,#142e51 0,var(--bg) 42rem)}main{width:min(1160px,calc(100% - 32px));margin:auto;padding:36px 0 48px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{margin:0;font-size:1.6rem}.dot{color:var(--green)}.badge{color:var(--green);border:1px solid #226445;padding:7px 11px;border-radius:99px;font-size:.78rem}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,1fr);gap:20px}.panel{background:#101c30e6;border:1px solid var(--line);border-radius:18px;overflow:hidden}.camera{position:relative;aspect-ratio:16/10;background:#050a12}.camera img{width:100%;height:100%;object-fit:cover;display:none}.empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:2rem}.camera.active img{display:block}.camera.active .empty{display:none}.side{padding:24px;display:flex;flex-direction:column;gap:20px}.eyebrow{color:var(--muted);font-size:.73rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.letter{font-size:7rem;font-weight:800;line-height:.85;color:var(--blue)}.status,.hint,.metrics{color:var(--muted)}.bar{height:8px;border-radius:99px;background:#07101d;overflow:hidden}.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .15s}.controls{display:flex;gap:10px}button{border:0;cursor:pointer;border-radius:10px;padding:11px 15px;font-weight:700;color:#04101a;background:var(--blue)}button.secondary{color:#dce8f9;background:#1e304c}button:disabled{opacity:.45}.history{padding:20px 24px;margin-top:20px}.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px;min-height:36px}.chip{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:#07111c;font-weight:800;background:var(--green)}.hint{font-size:.9rem;line-height:1.6}@media(max-width:760px){main{padding-top:22px}.grid{grid-template-columns:1fr}header{align-items:flex-start;gap:10px;flex-direction:column}}</style></head><body><main><header><h1>SignBridge<span class="dot">.</span> AI</h1><span class="badge" id="badge">CAMERA PAUSED</span></header><section class="grid"><div class="panel camera" id="camera"><img id="feed" alt="Live sign recognition camera"><div class="empty">Press <b>&nbsp;Start camera&nbsp;</b> to begin recognition.</div></div><aside class="panel side"><div class="eyebrow">Detected sign</div><div class="letter" id="letter">—</div><div class="status" id="status">Camera paused</div><div class="bar"><div id="progress"></div></div><div class="metrics" id="fps">0 FPS</div><div class="controls"><button id="start">Start camera</button><button class="secondary" id="stop" disabled>Stop</button></div><p class="hint">Keep one signing hand inside the blue box. The upper frame is ignored to prevent face detections.</p></aside></section><section class="panel history"><div class="eyebrow">Recently spoken</div><div class="chips" id="history"><span class="hint">No signs spoken yet.</span></div></section></main><script>const $=id=>document.getElementById(id);async function post(p){return fetch(p,{method:'POST'})}function setRun(r){$('start').disabled=r;$('stop').disabled=!r;$('badge').textContent=r?'CAMERA LIVE':'CAMERA PAUSED';$('camera').classList.toggle('active',r);if(!r)$('feed').removeAttribute('src')}async function refresh(){let s=await fetch('/api/status').then(r=>r.json());$('letter').textContent=s.letter;$('status').textContent=s.status;$('progress').style.width=s.progress+'%';$('fps').textContent=s.fps+' FPS';$('history').innerHTML=s.history.length?s.history.map(x=>`<span class="chip">${x}</span>`).join(''):'<span class="hint">No signs spoken yet.</span>';setRun(s.running)}$('start').onclick=async()=>{await post('/api/start');$('feed').src='/video_feed?'+Date.now();setRun(true);refresh()};$('stop').onclick=async()=>{await post('/api/stop');setRun(false);refresh()};setInterval(refresh,300);refresh()</script></body></html>
